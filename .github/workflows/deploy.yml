# 反映: main のデータ・設定・コードが変わったら、公開サイト(GitHub Pages)をビルドして公開する。収集はしない。
# 更新PRの自動マージ後は update.yml が明示的に起動する(GITHUB_TOKEN のマージは push イベントを起こさないため)。手動実行も可。
# Pages の有効化(Settings → Pages → Source: GitHub Actions)は別途必要。docs/operations.md §13。
name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/articles/**'
      - 'config/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 表示用データと選択(判断・ルール)を、正本(data/articles)と設定から作り直す。収集しない(公式サイトへアクセスしない)。
      - name: Regenerate data
        run: npm run update -- --no-collect
      - name: Build public site
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build:public
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
